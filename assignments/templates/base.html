<!DOCTYPE html>
<html>
<head>
    <title>Student Assignment Portal</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        nav {
            background: #333;
            padding: 10px;
        }
        nav a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            padding: 20px;
        }
        button {
            padding: 8px 15px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        input, select {
            padding: 5px;
            margin: 5px 0;
        }
    </style>
</head>
<body>

<nav>
    <a href="{% url 'set_preferences' %}">Set Preferences</a>
    <a href="{% url 'submit_assignment' %}">Submit Assignment</a>
    <a href="{% url 'list_assignments' %}">View Assignments</a>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
